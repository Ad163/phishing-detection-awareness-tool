<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDAT — Phishing Detection & Awareness Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --success: #059669;
    --success-light: #ecfdf5;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --border: #e5e7eb;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    padding: 40px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    margin-bottom: 4px;
  }
  .lead { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    resize: vertical;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    margin-top: 14px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .hint { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  .result { display: none; }
  .verdict-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .verdict-badge.phishing { background: var(--danger-light); color: var(--danger); }
  .verdict-badge.legitimate { background: var(--success-light); color: var(--success); }

  .confidence-row { margin-top: 12px; color: var(--muted); font-size: 0.95rem; }

  .summary {
    margin-top: 16px;
    line-height: 1.6;
    font-size: 1rem;
  }

  .explanation-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-top: 24px;
    margin-bottom: 10px;
  }
  .word-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    margin: 4px 6px 4px 0;
    font-size: 0.9rem;
  }
  .word-chip.toward-phishing { background: var(--danger-light); color: var(--danger); }
  .word-chip.toward-legitimate { background: var(--success-light); color: var(--success); }
  .word-chip .bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
  }
  .word-chip.toward-phishing .bar { background: var(--danger); }
  .word-chip.toward-legitimate .bar { background: var(--success); }

  .loading { display: none; color: var(--muted); margin-top: 14px; }
  .error-box {
    display: none;
    background: var(--danger-light);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Phishing Detection &amp; Awareness Tool</h1>
    <p class="lead">Paste an email below. The tool classifies it and explains, in plain language, exactly why.</p>

    <div class="card">
      <label for="emailText"><strong>Email text</strong></label>
      <textarea id="emailText" placeholder="Paste the full email text here, including subject line if available..."></textarea>
      <div class="hint">Nothing you paste here is stored or sent anywhere beyond this tool's own analysis.</div>
      <button id="analyzeBtn" onclick="analyzeEmail()">Analyze Email</button>
      <div class="loading" id="loading">Analyzing... this can take a few seconds.</div>
      <div class="error-box" id="errorBox"></div>
    </div>

    <div class="card result" id="resultCard">
      <span class="verdict-badge" id="verdictBadge"></span>
      <div class="confidence-row" id="confidenceRow"></div>
      <div class="summary" id="summaryText"></div>

      <div class="explanation-title">What drove this decision</div>
      <div id="wordChips"></div>
    </div>
  </div>

<script>
async function analyzeEmail() {
  const text = document.getElementById('emailText').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('errorBox');
  const resultCard = document.getElementById('resultCard');

  errorBox.style.display = 'none';
  resultCard.style.display = 'none';

  if (text.length < 10) {
    errorBox.textContent = 'Please paste a longer email before analyzing.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  loading.style.display = 'block';

  try {
    const res = await fetch('/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_text: text })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    renderResult(data);
  } catch (err) {
    errorBox.textContent = 'Error: ' + err.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

function renderResult(data) {
  const badge = document.getElementById('verdictBadge');
  const isPhishing = data.verdict === 'Phishing';
  badge.textContent = data.verdict;
  badge.className = 'verdict-badge ' + (isPhishing ? 'phishing' : 'legitimate');

  document.getElementById('confidenceRow').textContent =
    `Confidence: ${Math.round(data.confidence * 100)}%  (Phishing probability: ${Math.round(data.phishing_probability * 100)}%, Legitimate probability: ${Math.round(data.legitimate_probability * 100)}%)`;

  document.getElementById('summaryText').textContent = data.summary;

  const chipsContainer = document.getElementById('wordChips');
  chipsContainer.innerHTML = '';
  const maxAbsWeight = Math.max(...data.explanation.map(e => Math.abs(e.weight)), 0.0001);

  data.explanation
    .sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight))
    .forEach(e => {
      const chip = document.createElement('span');
      const towardPhishing = e.weight > 0;
      chip.className = 'word-chip ' + (towardPhishing ? 'toward-phishing' : 'toward-legitimate');
      const barWidth = Math.max(6, Math.round((Math.abs(e.weight) / maxAbsWeight) * 40));
      chip.innerHTML = `<span>${e.word}</span><span class="bar" style="width:${barWidth}px"></span>`;
      chipsContainer.appendChild(chip);
    });

  document.getElementById('resultCard').style.display = 'block';
}
</script>
</body>
</html>
